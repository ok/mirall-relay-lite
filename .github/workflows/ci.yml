name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # The live-DHT smoke test runs on a schedule, not per-PR: it is the one check that needs
    # Holepunch's bootstrap nodes, and an outage there must not red an unrelated pull request.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Unit + integration both run against a local testnet: no DHT egress, so a Holepunch
      # bootstrap outage cannot red an unrelated pull request.
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build local image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mirall-relay-lite:ci
          cache-from: type=gha

      - name: C5 size budget
        run: |
          bytes=$(docker image inspect mirall-relay-lite:ci --format '{{.Size}}')
          echo "image size: $((bytes/1024/1024)) MB" >> $GITHUB_STEP_SUMMARY
          test "$bytes" -lt $((300*1024*1024)) || { echo "over the 300 MB budget"; exit 1; }

      - name: C6 Alpine must fail
        run: |
          # udx-native and sodium-native ship glibc-only linux prebuilds. If this ever succeeds,
          # someone has changed the base image assumption and the README is wrong.
          sed 's|node:22-bookworm-slim|node:22-alpine|g' Dockerfile > Dockerfile.alpine
          if docker build -f Dockerfile.alpine -t alpine-probe . 2>/dev/null; then
            docker run --rm alpine-probe --help && { echo "Alpine unexpectedly works"; exit 1; }
          fi
          echo "Alpine fails as expected"

      - name: C2/C3 live DHT smoke test
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
        run: |
          docker volume create ci-data
          key() {
            docker run -d --name "$1" -v ci-data:/data mirall-relay-lite:ci >/dev/null
            for _ in $(seq 1 20); do
              docker logs "$1" 2>&1 | grep -qE '^  [a-z0-9]{52}$' && break; sleep 3
            done
            docker logs "$1" 2>&1 | grep -oE '[a-z0-9]{52}' | head -1
            docker rm -f "$1" >/dev/null
          }
          a=$(key ci1); b=$(key ci2)
          echo "first=$a second=$b"
          test -n "$a" || { echo "no key printed"; exit 1; }
          test "$a" = "$b" || { echo "key not stable across containers"; exit 1; }

  publish:
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Record the digest
        run: |
          echo "Published ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Pin this digest in production compose files." >> $GITHUB_STEP_SUMMARY
