name: container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # The live-DHT smoke test runs on a schedule, not per-PR, for the reason in test.yml.
    - cron: '17 6 * * *'
permissions: { contents: read, packages: write }
env:
  IMAGE: ghcr.io/ok/relay
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@v6
        with: { context: ., platforms: linux/amd64,linux/arm64, push: false, load: false }

      - name: Build local image for smoke tests
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: '${{ env.IMAGE }}:ci' }

      - name: C5 size budget
        run: |
          bytes=$(docker image inspect ${{ env.IMAGE }}:ci --format '{{.Size}}')
          echo "image size: $((bytes/1024/1024)) MB"
          test "$bytes" -lt $((300*1024*1024)) || { echo "over the 300 MB budget"; exit 1; }

      - name: C6 Alpine must fail
        run: |
          # udx-native and sodium-native ship glibc-only linux prebuilds. If this ever succeeds,
          # someone has changed the base image assumption and the README is wrong.
          sed 's|node:22-bookworm-slim|node:22-alpine|g' Dockerfile > Dockerfile.alpine
          if docker build -f Dockerfile.alpine -t alpine-probe . 2>/dev/null; then
            docker run --rm alpine-probe --help && { echo "Alpine unexpectedly works"; exit 1; }
          fi
          echo "Alpine fails as expected"

      - name: C2/C3 live DHT smoke test
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
        run: |
          docker volume create ci-data
          key() {
            docker run -d --name "$1" -v ci-data:/data ${{ env.IMAGE }}:ci >/dev/null
            for _ in $(seq 1 20); do
              docker logs "$1" 2>&1 | grep -qE '^  [a-z0-9]{52}$' && break; sleep 3
            done
            docker logs "$1" 2>&1 | grep -oE '[a-z0-9]{52}' | head -1
            docker rm -f "$1" >/dev/null
          }
          a=$(key ci1); b=$(key ci2)
          echo "first=$a second=$b"
          test -n "$a" || { echo "no key printed"; exit 1; }
          test "$a" = "$b" || { echo "key not stable across containers"; exit 1; }

      - name: Derive the major tag
        id: ver
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # v1.2.3 -> 1. docker-compose.yml pins the major so operators get fixes but never a
          # breaking change they did not ask for.
          major=${GITHUB_REF_NAME#v}
          echo "major=${major%%.*}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }

      - name: Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.major }}
