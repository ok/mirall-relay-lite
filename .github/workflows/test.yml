name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Unit + integration both run against a local testnet: no DHT egress, so a Holepunch
      # bootstrap outage cannot red an unrelated pull request.
      - run: npm test
